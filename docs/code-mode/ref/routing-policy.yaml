# Política de ruteo de mínima latencia — Universal-bot. Fuente de modelos: models.yaml.
# Resolución por perfil (models.yaml:server_profiles): cada paso de `chain` se queda solo si su
# (cli, model) pertenece a una suscripción del perfil. El primero que queda es el primario.
# Regla clave: para role=verifier, el resolver saltea el modelo primario del implementer emparejado.
version: 1
fallback:
  quota_exhausted: "si cli_quota de la suscripción del paso < 5% en cualquier ventana (5h/semanal/mensual) → saltar al próximo paso de OTRA suscripción"
  timeout: "si no hay primer token en timeout_ttft_s o no termina en timeout_s → matar y pasar al próximo paso (máx 2 saltos; después avisar)"
  error: "rc!=0 / auth → próximo paso; registrar en measurements"
  quality_degraded: "si el paso resuelto tiene degraded: true, el bot avisa que la respuesta no es de la calidad objetivo"
defaults: {timeout_ttft_s: 30, timeout_s: 1800}

routes:
  - id: charla
    category: charla
    tier: [T0, T1]
    role: charla
    why: "Respuesta corta: manda latencia; Haiku por OpenCode Go fue el más rápido medido (1.4 s) y es barato."
    chain:
      - {cli: opencode, model: opencode-go/claude-haiku-5-5, effort: default, why: "más rápido medido + cuota Go casi intacta"}
      - {cli: grok, model: grok-4.7, effort: low, why: "6-7 s, cuota sobrante, más inteligente"}
      - {cli: codex, model: gpt-6-luna, effort: low, fast: true, why: "10 s, barato"}
      - {cli: cursor-agent, model: composer-2.5-fast, effort: default, why: "mucha cuota pero ~20 s de arranque del CLI"}
      - {cli: agy, model: gemini-3.8-flash-low, effort: low, why: "solo-agy"}
      - {cli: opencode, model: opencode/deepseek-v4.1-flash-free, effort: default, why: "gratis"}

  - id: consulta_externa
    category: consulta_externa
    tier: [T0, T1, T2]
    role: consulta_externa
    why: "Research con modelos baratos (criterio Julian: Luna, Composer, Haiku)."
    chain:
      - {cli: opencode, model: opencode-go/gpt-6-luna, effort: default, why: "Luna por OpenCode Go: 1.5 s medido"}
      - {cli: codex, model: gpt-6-luna, effort: medium, fast: true, why: "Luna en Codex: 10 s, cuota Plus casi intacta"}
      - {cli: opencode, model: opencode-go/claude-haiku-5-5, effort: default, why: "rápido y barato"}
      - {cli: grok, model: grok-4.7, effort: low, why: "trae web/X search nativo"}
      - {cli: cursor-agent, model: composer-2.5-fast, effort: default, why: "cuota Cursor abundante"}
      - {cli: agy, model: gemini-3.8-flash-low, effort: low, why: "solo-agy"}
      - {cli: opencode, model: opencode/minimax-m3.1-flash-free, effort: default, why: "gratis"}

  - id: interno_servidor_t01
    category: interno_servidor
    tier: [T0, T1]
    role: interno_servidor
    why: "Ops con tools: Grok low tiene el mejor tool use rápido y cuota sobrante."
    chain:
      - {cli: grok, model: grok-4.7, effort: low, why: "6 s, tool use fuerte"}
      - {cli: opencode, model: opencode-go/deepseek-v4.1-flash, effort: default, why: "derivar a OpenCode; límite Go más alto"}
      - {cli: codex, model: gpt-6-luna, effort: low, fast: true, why: "rápido"}
      - {cli: cursor-agent, model: grok-4.7-low-fast, effort: low, why: "mismo modelo por Cursor"}
      - {cli: agy, model: gemini-3.8-flash-low, effort: low, why: "solo-agy"}
      - {cli: opencode, model: opencode/deepseek-v4.1-flash-free, effort: default, why: "gratis"}

  - id: interno_servidor_t23
    category: interno_servidor
    tier: [T2, T3]
    role: interno_servidor
    why: "Ops largas: Grok medium, misma latencia medida que low."
    chain:
      - {cli: grok, model: grok-4.7, effort: medium, why: "5-6 s medido, más razonamiento"}
      - {cli: opencode, model: opencode-go/glm-5.3, effort: default, why: "OpenCode capaz y 2.8 s medido"}
      - {cli: opencode, model: opencode-go/deepseek-v4-pro, effort: default, why: "OpenCode; OJO falló (rc=1) en la medición 2026-10-20"}
      - {cli: codex, model: gpt-6-luna, effort: high, fast: true, why: "Luna high"}
      - {cli: cursor-agent, model: grok-4.7-medium-fast, effort: medium, why: "Grok por Cursor"}
      - {cli: agy, model: gemini-3.8-flash-high, effort: high, why: "solo-agy"}
      - {cli: opencode, model: opencode/deepseek-v4.1-flash-free, effort: default, why: "gratis"}

  - id: codigo_chico
    category: codigo_chico
    tier: [T0, T1]
    role: codigo_chico
    why: "Código chico: derivar a OpenCode DeepSeek Flash (barato, buen código)."
    chain:
      - {cli: opencode, model: opencode-go/deepseek-v4.1-flash, effort: default, why: "criterio Julian: todo lo posible a OpenCode"}
      - {cli: grok, model: grok-4.7, effort: low, why: "si Go agotado o lento"}
      - {cli: cursor-agent, model: composer-2.5-fast, effort: default, why: "Composer bueno en edits chicos"}
      - {cli: codex, model: gpt-6-luna, effort: low, fast: true, why: "rápido"}
      - {cli: agy, model: gemini-3.8-flash-low, effort: low, why: "solo-agy"}
      - {cli: opencode, model: opencode/deepseek-v4.1-flash-free, effort: default, why: "gratis"}

  - id: padre_clasificador
    category: modo_codigo
    tier: [T2, T3]
    role: padre_clasificador
    why: "El padre decide y delega: rápido + buen juicio + tool use."
    chain:
      - {cli: grok, model: grok-4.7, effort: low, why: "6 s, juicio bueno, cuota sobrante"}
      - {cli: codex, model: gpt-6-luna, effort: low, fast: true, why: "10 s"}
      - {cli: opencode, model: opencode-go/claude-haiku-5-5, effort: default, why: "Haiku = clasificación (Anthropic)"}
      - {cli: cursor-agent, model: composer-2.5-fast, effort: default, why: "solo-cursor"}
      - {cli: agy, model: gemini-3.8-flash-low, effort: low, why: "solo-agy"}
      - {cli: opencode, model: opencode/glm-5.3-flash-free, effort: default, why: "gratis"}

  - id: scout
    category: modo_codigo
    tier: [T2, T3]
    role: scout
    why: "Leer mucho y resumir: barato con buen tool use."
    chain:
      - {cli: opencode, model: opencode-go/deepseek-v4.1-flash, effort: default, why: "barato, límite Go alto"}
      - {cli: cursor-agent, model: composer-2.5-fast, effort: default, why: "Composer indexa bien el repo"}
      - {cli: codex, model: gpt-6-luna, effort: low, fast: true, why: "barato"}
      - {cli: grok, model: grok-4.7, effort: low, why: "fallback rápido"}
      - {cli: agy, model: gemini-3.8-flash-low, effort: low, why: "solo-agy"}
      - {cli: opencode, model: opencode/minimax-m3.1-flash-free, effort: default, why: "gratis"}

  - id: lab
    category: modo_codigo
    tier: [T2, T3]
    role: lab
    why: "Experimentos iterativos: caballo de batalla."
    chain:
      - {cli: grok, model: grok-4.7, effort: medium, why: "rápido e inteligente, cuota sobrante"}
      - {cli: opencode, model: opencode-go/deepseek-v4.1-flash, effort: default, why: "OpenCode barato"}
      - {cli: codex, model: gpt-6-luna, effort: medium, fast: true, why: "Luna medium"}
      - {cli: cursor-agent, model: composer-2.5-fast, effort: default, why: "solo-cursor"}
      - {cli: agy, model: gemini-3.8-flash-high, effort: high, why: "solo-agy"}
      - {cli: opencode, model: opencode/big-pickle, effort: default, why: "gratis"}

  - id: implementer_t2
    category: modo_codigo
    tier: [T2]
    role: implementer
    why: "Implementación: Grok medium como caballo de batalla; DeepSeek Pro si Grok se agota."
    chain:
      - {cli: grok, model: grok-4.7, effort: medium, why: "rápido, buen código, cuota sobrante"}
      - {cli: opencode, model: opencode-go/glm-5.3, effort: default, why: "OpenCode capaz y 2.8 s medido"}
      - {cli: opencode, model: opencode-go/deepseek-v4-pro, effort: default, why: "OpenCode; OJO falló (rc=1) en la medición 2026-10-20"}
      - {cli: codex, model: gpt-6-luna, effort: high, fast: true, why: "Luna high"}
      - {cli: cursor-agent, model: grok-4.7-medium-fast, effort: medium, why: "Grok por Cursor (cuota Grok abundante)"}
      - {cli: agy, model: gemini-4-argon-medium, effort: medium, why: "solo-agy"}
      - {cli: opencode, model: opencode/deepseek-v4.1-flash-free, effort: default, why: "gratis"}

  - id: implementer_t3
    category: modo_codigo
    tier: [T3]
    role: implementer
    why: "T3: más esfuerzo, mismo caballo; Sonnet solo como último recurso de calidad."
    chain:
      - {cli: grok, model: grok-4.7, effort: high, why: "más razonamiento"}
      - {cli: codex, model: gpt-6-luna, effort: xhigh, fast: true, why: "memoria: LUNA XHIGH FAST si cuota OK"}
      - {cli: opencode, model: opencode-go/glm-5.3, effort: default, why: "OpenCode capaz, 2.8 s"}
      - {cli: cursor-agent, model: grok-4.7-high-fast, effort: high, why: "solo-cursor"}
      - {cli: agy, model: gemini-4-argon-high, effort: high, why: "solo-agy"}
      - {cli: opencode, model: opencode/deepseek-v4.1-flash-free, effort: default, degraded: true, why: "gratis, calidad baja para T3"}

  - id: verifier_t2
    category: modo_codigo
    tier: [T2]
    role: verifier
    pairs_with: implementer_t2
    why: "Verificar con otro modelo/vendor que el implementer (sesgos distintos)."
    chain:
      - {cli: codex, model: gpt-6-luna, effort: medium, fast: true, why: "otro vendor que Grok, barato"}
      - {cli: opencode, model: opencode-go/deepseek-v4.1-flash, effort: default, why: "OpenCode, distinto de DeepSeek Pro"}
      - {cli: opencode, model: opencode-go/kimi-k2.7-code, effort: default, why: "solo-opencode-go alterno"}
      - {cli: cursor-agent, model: composer-2.5-fast, effort: default, why: "distinto de Grok en Cursor"}
      - {cli: codex, model: gpt-6-sol, effort: medium, why: "solo-codex: distinto de Luna"}
      - {cli: grok, model: grok-4.6, effort: medium, why: "solo-grok: modelo distinto"}
      - {cli: agy, model: gemini-3.8-flash-high, effort: high, why: "solo-agy: distinto de Argon"}
      - {cli: opencode, model: opencode/minimax-m3.1-flash-free, effort: default, why: "gratis, distinto de DeepSeek free"}

  - id: verifier_t3
    category: modo_codigo
    tier: [T3]
    role: verifier
    pairs_with: implementer_t3
    why: "T3: verificador más fuerte y de otro vendor."
    chain:
      - {cli: codex, model: gpt-6-sol, effort: high, why: "Sol: alternativa barata a Opus en razonamiento"}
      - {cli: opencode, model: opencode-go/kimi-k3, effort: default, why: "OpenCode más fuerte, 2.9 s"}
      - {cli: opencode, model: opencode-go/deepseek-v4-pro, effort: default, why: "alterno (falló en medición)"}
      - {cli: cursor-agent, model: claude-sonnet-5-5-medium, effort: medium, why: "solo-cursor: Claude verifica bien"}
      - {cli: grok, model: grok-4.6, effort: high, why: "solo-grok"}
      - {cli: agy, model: claude-sonnet-5-5-high, effort: high, why: "solo-agy"}
      - {cli: opencode, model: opencode/minimax-m3.1-flash-free, effort: default, degraded: true, why: "gratis"}

  - id: auditor
    category: modo_codigo
    tier: [T2, T3]
    role: auditor
    why: "Auditoría (seguridad/regresiones): calidad > latencia, pero sin quemar Opus."
    chain:
      - {cli: codex, model: gpt-6-sol, effort: high, why: "fuerte y más barato que Opus"}
      - {cli: cursor-agent, model: claude-sonnet-5-5-high, effort: high, why: "Claude: mejor criterio"}
      - {cli: agy, model: claude-sonnet-5-5-high, effort: high, why: "Claude por cuota Google"}
      - {cli: opencode, model: opencode-go/kimi-k3, effort: default, why: "mejor de Go para review"}
      - {cli: grok, model: grok-4.7, effort: high, degraded: true, why: "solo-grok"}

  - id: diseno_ui
    category: modo_codigo
    tier: [T2, T3]
    role: diseno_ui
    why: "Diseño: Claude es el mejor (Julian). Sonnet por defecto; Opus solo si hace falta."
    chain:
      - {cli: agy, model: claude-sonnet-5-5-high, effort: high, why: "Claude por Google AI Pro: 5.6 s medido (low) vs ~25 s Cursor"}
      - {cli: cursor-agent, model: claude-sonnet-5-5-medium, effort: medium, why: "Claude por Cursor (pool API) si AGY agotado"}
      - {cli: opencode, model: opencode-go/glm-5.3, effort: default, degraded: true, why: "alternativa barata a Sonnet [NV]"}
      - {cli: codex, model: gpt-6-sol, effort: high, degraded: true, why: "solo-codex"}
      - {cli: grok, model: grok-4.7, effort: high, degraded: true, why: "solo-grok"}

  - id: arquitectura
    category: modo_codigo
    tier: [T3]
    role: arquitectura
    why: "Arquitectura: Opus (Julian), pocas veces y con effort medium."
    chain:
      - {cli: agy, model: claude-opus-5-5-medium, effort: medium, why: "Opus (el mejor para arquitectura) por AGY: CLI más rápido medido para Claude"}
      - {cli: cursor-agent, model: claude-opus-5-5-medium, effort: medium, why: "Opus por Cursor si AGY agotado"}
      - {cli: codex, model: gpt-6-sol, effort: xhigh, why: "más cercano a Opus y mucho más barato (benchmark del vendor)"}
      - {cli: opencode, model: opencode-go/kimi-k3, effort: default, degraded: true, why: "mejor de Go"}
      - {cli: grok, model: grok-4.7, effort: xhigh, degraded: true, why: "solo-grok"}

# Huecos declarados: (perfil → rutas que quedan SIN modelo). El test exige que todo lo demás resuelva.
gaps:
  ninguna: [auditor, diseno_ui, arquitectura]
