# Universal Bot Instance Configuration
# Copy to config/instance.toml (gitignored) or instances/<name>/instance.toml on the host.

schema_version = 1

[meta]
instance_name = "example-site"
host_os = "auto"          # auto | linux | windows
host_role = "vps"          # vm | vps | pc-server
timezone = "America/Buenos_Aires"

[discord]
# Create a NEW Discord application per installation. Never reuse Frontera tokens.
guild_id = "REPLACE_GUILD_ID"
bot_id = "REPLACE_BOT_ID"
# Allowlist of user IDs that may invoke CLIs. Empty list = DENY ALL (safe deny-by-default).
allowlist_ids = ["REPLACE_ADMIN_USER_ID"]
allowed_channel_ids = []
auto_channels = []
allow_dm = false
# Privileged intent Message Content must be ON in the Developer Portal
message_content_intent = true

[paths]
# Paths: relative paths resolve cleanly against this instance's directory.
state_dir = "./state"
jobs_dir = "./state/jobs"
logs_dir = "./state/logs"
workspace_dir = "./workspaces"
secrets_file = "./secrets.env"
lock_root = "./state/locks"

[runtime]
python_cmd = ["python3"]   # Windows: ["py", "-3"]
timeout_long_s = 1800
shutdown_grace_s = 60
max_concurrent_jobs = 2
max_pending_jobs = 20
progress_interval_s = 120
progress_freshness_s = 180
watch_interval_s = 60
default_brain = ""         # Empty = diagnostic mode until an adapter is enabled

[cli]
# Configure available CLIs on this host. Unconfigured/disabled CLIs are never run.
# agy = { enabled = true, command = ["agy"] }
# codex = { enabled = false, command = ["codex"] }
# opencode = { enabled = false, command = ["opencode"] }
# cursor = { enabled = false, command = ["cursor"] }

[features]
context7_native = false
