# Copy to config/instance.toml (gitignored) or
# instances/<name>/instance.toml on the host only.

[meta]
instance_name = "example-site"
host_os = "linux"          # linux | windows
host_role = "vps"          # vm | vps | pc-server
timezone = "America/Buenos_Aires"

[discord]
# Create a NEW Discord application per installation. Never reuse Frontera tokens.
guild_id = "REPLACE_GUILD_ID"
bot_id = "REPLACE_BOT_ID"
# Allowlist of user IDs that may invoke CLIs
allowlist_ids = ["REPLACE_ADMIN_USER_ID"]
# Privileged intent Message Content must be ON in the Developer Portal
message_content_intent = true

[paths]
# Listener + MCP + CLIs on ONE machine
install_dir = "/opt/universal-bot"          # Windows: C:\\universal-bot
token_env = "~/.config/universal-bot/example-site.env"
jobs_dir = "/var/lib/universal-bot/jobs"
logs_dir = "/var/lib/universal-bot/logs"

[runtime]
python = "python3"         # Windows: py -3
timeout_long_s = 1800
inflight_wait_s = 1860     # >= timeout_long_s + 60
watch_interval_s = 60
default_brain = "agy"      # agy | opencode | codex | cursor

[cli]
# Leave empty until that CLI is installed on this host
agy = false
opencode = false
codex = false
cursor = false
context7_native = false
