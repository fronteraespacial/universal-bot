[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-bot"
version = "0.1.0"
description = "A portable, self-hosted Discord agent gateway and worker."
readme = "README.md"
authors = [{ name = "Frontera Espacial" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
